<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#e8f4f8"/>
  
  <!-- Mountains -->
  <path d="M0,400 L50,200 L100,350 L150,150 L200,300 L250,180 L300,320 L350,200 L400,350 L450,150 L500,280 L550,180 L600,250 L650,150 L700,300 L750,180 L800,400 L800,600 L0,600 Z" fill="#d6d6d6" stroke="#a9a9a9" stroke-width="2"/>
  
  <!-- Snow caps -->
  <path d="M50,200 L65,180 L85,190 L100,350 M150,150 L165,130 L185,140 L200,300 M250,180 L265,160 L285,170 L300,320 M350,200 L365,180 L385,190 L400,350 M450,150 L465,130 L485,140 L500,280 M550,180 L565,160 L585,170 L600,250 M650,150 L665,130 L685,140 L700,300 M750,180 L765,160 L785,170 L800,250" fill="none" stroke="white" stroke-width="8"/>
  
  <!-- Forbidden Peaks -->
  <path d="M580,230 L600,120 L620,210 L650,100 L670,220 L680,150 L700,250" fill="#b4b4b4" stroke="#8a8a8a" stroke-width="3"/>
  <text x="620" y="260" font-family="Arial" font-size="14" fill="#3a3a3a" font-weight="bold">Forbidden Peaks</text>
  
  <!-- Forests -->
  <g fill="#85c47c">
    <circle cx="120" cy="450" r="30"/>
    <circle cx="160" cy="440" r="25"/>
    <circle cx="100" cy="480" r="22"/>
    <circle cx="140" cy="490" r="28"/>
    
    <circle cx="320" cy="460" r="30"/>
    <circle cx="350" cy="480" r="25"/>
    <circle cx="290" cy="490" r="22"/>
    <circle cx="330" cy="500" r="28"/>
    
    <circle cx="490" cy="470" r="30"/>
    <circle cx="520" cy="490" r="25"/>
    <circle cx="470" cy="500" r="22"/>
    <circle cx="510" cy="510" r="28"/>
  </g>
  
  <!-- Yeti Settlement -->
  <circle cx="380" cy="380" r="20" fill="#a1d6e2" stroke="#1995ad" stroke-width="3"/>
  <text x="350" y="420" font-family="Arial" font-size="14" fill="#1995ad" font-weight="bold">Yeti Council</text>
  <path d="M370,375 L375,365 L385,375 L380,380 Z" fill="white"/>
  
  <!-- Snowhaven -->
  <circle cx="250" cy="350" r="15" fill="#a1d6e2" stroke="#1995ad" stroke-width="2"/>
  <text x="220" y="380" font-family="Arial" font-size="12" fill="#1995ad">Snowhaven</text>
  <path d="M245,345 L250,335 L255,345 L250,350 Z" fill="white"/>
  
  <!-- Sphere Location -->
  <circle cx="200" cy="260" r="18" fill="#b30000" stroke="#800000" stroke-width="3"/>
  <text x="145" y="240" font-family="Arial" font-size="14" fill="#b30000" font-weight="bold">Frost Sphere</text>
  <path d="M200,260 L210,250 M200,260 L190,250 M200,260 L210,270 M200,260 L190,270" stroke="#800000" stroke-width="2"/>
  
  <!-- Paths -->
  <path d="M360,380 C330,370 290,360 250,350" fill="none" stroke="#8a7444" stroke-width="3" stroke-dasharray="5,3"/>
  <path d="M250,350 C240,320 220,290 200,260" fill="none" stroke="#8a7444" stroke-width="3" stroke-dasharray="5,3"/>
  
  <!-- Compass Rose -->
  <g transform="translate(700, 100)">
    <circle cx="0" cy="0" r="30" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
    <path d="M0,-25 L5,-5 L0,-10 L-5,-5 Z" fill="#333"/>
    <path d="M0,25 L5,5 L0,10 L-5,5 Z" fill="#333"/>
    <path d="M-25,0 L-5,5 L-10,0 L-5,-5 Z" fill="#333"/>
    <path d="M25,0 L5,5 L10,0 L5,-5 Z" fill="#333"/>
    <text x="0" y="-35" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">N</text>
    <text x="0" y="45" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">S</text>
    <text x="-35" y="5" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">W</text>
    <text x="35" y="5" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">E</text>
  </g>
  
  <!-- Legend -->
  <rect x="50" y="50" width="180" height="130" rx="10" fill="#f5f5f5" fill-opacity="0.8" stroke="#333" stroke-width="1"/>
  <text x="70" y="80" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Legend</text>
  
  <circle cx="80" cy="100" r="6" fill="#a1d6e2" stroke="#1995ad" stroke-width="2"/>
  <text x="95" y="105" font-family="Arial" font-size="12" fill="#333">Yeti Settlement</text>
  
  <circle cx="80" cy="125" r="6" fill="#b30000" stroke="#800000" stroke-width="2"/>
  <text x="95" y="130" font-family="Arial" font-size="12" fill="#333">Frost Sphere</text>
  
  <line x1="70" y1="150" x2="90" y2="150" stroke="#8a7444" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="95" y="155" font-family="Arial" font-size="12" fill="#333">Mountain Path</text>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" fill="#333" text-anchor="middle" font-weight="bold">The Frost Architect's Domain</text>
  <text x="400" y="65" font-family="Arial" font-size="14" fill="#666" text-anchor="middle" font-style="italic">Mountain Regions of the Northern Realm</text>
</svg>