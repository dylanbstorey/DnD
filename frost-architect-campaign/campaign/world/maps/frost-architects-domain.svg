<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#e8f4f8"/>
  
  <!-- Mountains -->
  <path d="M0,400 L50,200 L100,350 L150,150 L200,300 L250,180 L300,320 L350,200 L400,350 L450,150 L500,280 L550,180 L600,250 L650,150 L700,300 L750,180 L800,400 L800,600 L0,600 Z" fill="#d6d6d6" stroke="#a9a9a9" stroke-width="2"/>
  
  <!-- Snow caps -->
  <path d="M50,200 L65,180 L85,190 L100,350 M150,150 L165,130 L185,140 L200,300 M250,180 L265,160 L285,170 L300,320 M350,200 L365,180 L385,190 L400,350 M450,150 L465,130 L485,140 L500,280 M550,180 L565,160 L585,170 L600,250 M650,150 L665,130 L685,140 L700,300 M750,180 L765,160 L785,170 L800,250" fill="none" stroke="white" stroke-width="8"/>
  
  <!-- Forbidden Peaks -->
  <path d="M580,230 L600,120 L620,210 L650,100 L670,220 L680,150 L700,250" fill="#b4b4b4" stroke="#8a8a8a" stroke-width="3"/>
  <text x="620" y="260" font-family="Arial" font-size="14" fill="#3a3a3a" font-weight="bold">Forbidden Peaks</text>
  
  <!-- Forests -->
  <g fill="#85c47c">
    <circle cx="120" cy="450" r="30"/>
    <circle cx="160" cy="440" r="25"/>
    <circle cx="100" cy="480" r="22"/>
    <circle cx="140" cy="490" r="28"/>
    
    <circle cx="320" cy="460" r="30"/>
    <circle cx="350" cy="480" r="25"/>
    <circle cx="290" cy="490" r="22"/>
    <circle cx="330" cy="500" r="28"/>
    
    <circle cx="490" cy="470" r="30"/>
    <circle cx="520" cy="490" r="25"/>
    <circle cx="470" cy="500" r="22"/>
    <circle cx="510" cy="510" r="28"/>
  </g>
  
  <!-- Yeti Settlement -->
  <circle cx="380" cy="380" r="20" fill="#a1d6e2" stroke="#1995ad" stroke-width="3"/>
  <text x="350" y="420" font-family="Arial" font-size="14" fill="#1995ad" font-weight="bold">Yeti Council</text>
  <path d="M370,375 L375,365 L385,375 L380,380 Z" fill="white"/>
  
  <!-- Snowhaven -->
  <circle cx="250" cy="350" r="15" fill="#a1d6e2" stroke="#1995ad" stroke-width="2"/>
  <text x="220" y="380" font-family="Arial" font-size="12" fill="#1995ad">Snowhaven</text>
  <path d="M245,345 L250,335 L255,345 L250,350 Z" fill="white"/>
  
  <!-- First Sphere Location -->
  <circle cx="200" cy="260" r="18" fill="#b30000" stroke="#800000" stroke-width="3"/>
  <text x="145" y="240" font-family="Arial" font-size="14" fill="#b30000" font-weight="bold">First Sphere</text>
  <path d="M200,260 L210,250 M200,260 L190,250 M200,260 L210,270 M200,260 L190,270" stroke="#800000" stroke-width="2"/>
  
  <!-- Other Sphere Locations (Inactive or Planned) -->
  <circle cx="500" cy="350" r="15" fill="#b30000" stroke="#800000" stroke-width="2" opacity="0.6"/>
  <path d="M500,350 L508,342 M500,350 L492,342 M500,350 L508,358 M500,350 L492,358" stroke="#800000" stroke-width="2" opacity="0.6"/>
  
  <circle cx="320" cy="280" r="15" fill="#b30000" stroke="#800000" stroke-width="2" opacity="0.6"/>
  <path d="M320,280 L328,272 M320,280 L312,272 M320,280 L328,288 M320,280 L312,288" stroke="#800000" stroke-width="2" opacity="0.6"/>
  
  <circle cx="600" cy="400" r="15" fill="#b30000" stroke="#800000" stroke-width="2" opacity="0.6"/>
  <path d="M600,400 L608,392 M600,400 L592,392 M600,400 L608,408 M600,400 L592,408" stroke="#800000" stroke-width="2" opacity="0.6"/>
  
  <!-- Caverns of Echo (Stone of Clarity) -->
  <path d="M530,180 C535,175 540,178 545,175 C550,172 555,175 560,180" fill="none" stroke="#663300" stroke-width="3"/>
  <circle cx="545" cy="190" r="15" fill="#ffcc00" stroke="#cc9900" stroke-width="2" opacity="0.8"/>
  <text x="500" y="215" font-family="Arial" font-size="12" fill="#663300">Caverns of Echo</text>
  
  <!-- Frosthold (Stone of Resilience) -->
  <path d="M100,300 L130,300 L130,320 L100,320 Z" fill="#555" stroke="#333" stroke-width="2"/>
  <circle cx="115" cy="310" r="15" fill="#c0c0c0" stroke="#999999" stroke-width="2" opacity="0.8"/>
  <text x="80" y="340" font-family="Arial" font-size="12" fill="#555">Frosthold</text>
  
  <!-- Glacier Temple (Stone of Harmony) -->
  <path d="M700,200 L720,180 L740,200 L740,220 L720,240 L700,220 Z" fill="#88ccff" stroke="#55aaee" stroke-width="2"/>
  <circle cx="720" cy="210" r="15" fill="#88ffff" stroke="#55eeee" stroke-width="2" opacity="0.8"/>
  <text x="690" y="260" font-family="Arial" font-size="12" fill="#4499dd">Glacier Temple</text>
  
  <!-- Network connections between spheres (faint, as seen in vision) -->
  <path d="M200,260 C250,300 300,290 320,280" fill="none" stroke="#b30000" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.4"/>
  <path d="M320,280 C370,330 450,330 500,350" fill="none" stroke="#b30000" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.4"/>
  <path d="M500,350 C550,370 580,390 600,400" fill="none" stroke="#b30000" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.4"/>
  <path d="M200,260 C300,210 400,150 650,150" fill="none" stroke="#b30000" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.4"/>
  
  <!-- Current and upcoming paths -->
  <path d="M380,380 C330,370 290,360 250,350" fill="none" stroke="#8a7444" stroke-width="3" stroke-dasharray="5,3"/>
  <path d="M250,350 C240,320 220,290 200,260" fill="none" stroke="#8a7444" stroke-width="3" stroke-dasharray="5,3"/>
  <path d="M380,380 C430,330 490,240 545,190" fill="none" stroke="#8a7444" stroke-width="3" stroke-dasharray="5,3" opacity="0.6"/>
  
  <!-- Compass Rose -->
  <g transform="translate(700, 100)">
    <circle cx="0" cy="0" r="30" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
    <path d="M0,-25 L5,-5 L0,-10 L-5,-5 Z" fill="#333"/>
    <path d="M0,25 L5,5 L0,10 L-5,5 Z" fill="#333"/>
    <path d="M-25,0 L-5,5 L-10,0 L-5,-5 Z" fill="#333"/>
    <path d="M25,0 L5,5 L10,0 L5,-5 Z" fill="#333"/>
    <text x="0" y="-35" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">N</text>
    <text x="0" y="45" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">S</text>
    <text x="-35" y="5" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">W</text>
    <text x="35" y="5" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">E</text>
  </g>
  
  <!-- Legend -->
  <rect x="50" y="50" width="200" height="190" rx="10" fill="#f5f5f5" fill-opacity="0.8" stroke="#333" stroke-width="1"/>
  <text x="70" y="80" font-family="Arial" font-size="14" fill="#333" font-weight="bold">Legend</text>
  
  <circle cx="80" cy="100" r="6" fill="#a1d6e2" stroke="#1995ad" stroke-width="2"/>
  <text x="95" y="105" font-family="Arial" font-size="12" fill="#333">Yeti Settlement</text>
  
  <circle cx="80" cy="125" r="6" fill="#b30000" stroke="#800000" stroke-width="2"/>
  <text x="95" y="130" font-family="Arial" font-size="12" fill="#333">Frost Sphere (Active)</text>
  
  <circle cx="80" cy="150" r="6" fill="#b30000" stroke="#800000" stroke-width="2" opacity="0.6"/>
  <text x="95" y="155" font-family="Arial" font-size="12" fill="#333">Frost Sphere (Planned)</text>
  
  <circle cx="80" cy="175" r="6" fill="#ffcc00" stroke="#cc9900" stroke-width="2" opacity="0.8"/>
  <text x="95" y="180" font-family="Arial" font-size="12" fill="#333">Stone of Binding</text>
  
  <line x1="70" y1="200" x2="90" y2="200" stroke="#8a7444" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="95" y="205" font-family="Arial" font-size="12" fill="#333">Mountain Path</text>
  
  <line x1="70" y1="225" x2="90" y2="225" stroke="#b30000" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.4"/>
  <text x="95" y="230" font-family="Arial" font-size="12" fill="#333">Sphere Network</text>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" fill="#333" text-anchor="middle" font-weight="bold">The Frost Architect's Domain</text>
  <text x="400" y="65" font-family="Arial" font-size="14" fill="#666" text-anchor="middle" font-style="italic">Mountain Regions of the Northern Realm</text>
</svg>