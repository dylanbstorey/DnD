<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#0c1438" />
  
  <!-- Cave Edges -->
  <path d="M100,100 C150,80 200,110 250,90 C300,70 350,60 400,80 C450,100 500,90 550,110 C600,130 650,120 700,140 L700,500 C650,520 600,500 550,520 C500,540 450,530 400,510 C350,490 300,500 250,520 C200,540 150,530 100,500 Z" fill="#1a2950" stroke="#293c74" stroke-width="4" />
  
  <!-- Entrance Section -->
  <path d="M100,300 C120,280 150,290 170,280 C190,270 210,290 230,280 L230,320 C210,330 190,310 170,320 C150,330 120,320 100,340 Z" fill="#293c74" stroke="#4969b0" stroke-width="2" />
  <text x="170" y="260" fill="white" font-family="Arial" font-size="16" text-anchor="middle">Entrance</text>
  <circle cx="180" cy="300" r="10" fill="#7391e0" opacity="0.7" />
  <circle cx="190" cy="290" r="8" fill="#7391e0" opacity="0.7" />
  <circle cx="170" cy="310" r="9" fill="#7391e0" opacity="0.7" />
  
  <!-- Path to Whispering Galleries -->
  <path d="M230,300 Q280,280 320,300 Q340,315 370,300" fill="none" stroke="#4969b0" stroke-width="3" stroke-dasharray="5,5" />
  
  <!-- Whispering Galleries -->
  <path d="M370,200 C390,180 420,220 450,170 C480,120 510,150 530,200 C550,250 520,270 500,290 C480,310 440,280 420,310 C400,340 370,330 350,300 C330,270 350,220 370,200 Z" fill="#293c74" stroke="#4969b0" stroke-width="2" />
  <text x="450" y="180" fill="white" font-family="Arial" font-size="16" text-anchor="middle">Whispering Galleries</text>
  
  <!-- Maze-like patterns in Whispering Galleries -->
  <path d="M400,200 Q420,220 440,210 Q460,200 450,230 Q440,260 420,250 Q400,240 400,200" fill="none" stroke="#7391e0" stroke-width="1.5" />
  <path d="M380,230 Q400,240 410,270 Q420,300 390,290" fill="none" stroke="#7391e0" stroke-width="1.5" />
  <path d="M460,200 Q490,210 500,240 Q510,270 490,260" fill="none" stroke="#7391e0" stroke-width="1.5" />
  <circle cx="440" cy="210" r="5" fill="#a4bdff" opacity="0.8" />
  <circle cx="420" cy="260" r="5" fill="#a4bdff" opacity="0.8" />
  <circle cx="500" cy="240" r="5" fill="#a4bdff" opacity="0.8" />
  
  <!-- Path to Frozen Lake -->
  <path d="M420,310 Q440,350 470,370" fill="none" stroke="#4969b0" stroke-width="3" stroke-dasharray="5,5" />
  
  <!-- Frozen Lake -->
  <ellipse cx="550" cy="400" rx="100" ry="70" fill="#293c74" stroke="#4969b0" stroke-width="2" />
  <ellipse cx="550" cy="400" rx="80" ry="55" fill="#4969b0" opacity="0.5" />
  <text x="550" y="390" fill="white" font-family="Arial" font-size="16" text-anchor="middle">Frozen Lake</text>
  
  <!-- Ice Columns -->
  <circle cx="520" cy="370" r="5" fill="#a4bdff" />
  <circle cx="535" cy="420" r="5" fill="#a4bdff" />
  <circle cx="565" cy="360" r="5" fill="#a4bdff" />
  <circle cx="580" cy="410" r="5" fill="#a4bdff" />
  <circle cx="550" cy="440" r="5" fill="#a4bdff" />
  
  <!-- Depth Hunter's Shadow -->
  <path d="M520,400 Q550,390 580,405" stroke="#1a2950" stroke-width="8" opacity="0.6" />
  
  <!-- Path to Chamber of Resonance -->
  <path d="M620,420 Q650,440 680,430" fill="none" stroke="#4969b0" stroke-width="3" stroke-dasharray="5,5" />
  
  <!-- Chamber of Resonance -->
  <circle cx="700" cy="370" r="60" fill="#293c74" stroke="#4969b0" stroke-width="2" />
  <circle cx="700" cy="370" r="45" fill="#7391e0" opacity="0.2" />
  <text x="700" y="350" fill="white" font-family="Arial" font-size="16" text-anchor="middle">Chamber of</text>
  <text x="700" y="370" fill="white" font-family="Arial" font-size="16" text-anchor="middle">Resonance</text>
  
  <!-- Center Dais with Star Pattern -->
  <circle cx="700" cy="370" r="15" fill="#4969b0" stroke="#a4bdff" stroke-width="1" />
  
  <!-- Seven-pointed Star Pattern -->
  <path d="M700,355 L703,367 L715,370 L703,373 L700,385 L697,373 L685,370 L697,367 Z" fill="none" stroke="#a4bdff" stroke-width="1" />
  <circle cx="700" cy="370" r="3" fill="#ffffff" />
  
  <!-- Crystal Formations in Chamber -->
  <path d="M660,340 L670,320 L680,340" stroke="#a4bdff" stroke-width="2" />
  <path d="M670,400 L680,420 L690,400" stroke="#a4bdff" stroke-width="2" />
  <path d="M720,330 L730,310 L740,330" stroke="#a4bdff" stroke-width="2" />
  <path d="M730,400 L740,420 L750,400" stroke="#a4bdff" stroke-width="2" />
  
  <!-- Guardian of Resonance Location -->
  <circle cx="700" cy="340" r="8" fill="#a4bdff" opacity="0.8" />
  
  <!-- Legend -->
  <rect x="60" y="500" width="200" height="80" fill="#1a2950" stroke="#293c74" stroke-width="2" rx="5" ry="5" />
  <text x="160" y="520" fill="white" font-family="Arial" font-size="14" text-anchor="middle">LEGEND</text>
  
  <circle cx="80" cy="540" r="5" fill="#7391e0" />
  <text x="160" y="545" fill="white" font-family="Arial" font-size="12">Crystal Formations</text>
  
  <path d="M70,560 L90,560" stroke="#4969b0" stroke-width="3" stroke-dasharray="5,5" />
  <text x="160" y="565" fill="white" font-family="Arial" font-size="12">Passageways</text>
  
  <!-- Compass Rose -->
  <circle cx="720" cy="530" r="30" fill="#1a2950" stroke="#293c74" stroke-width="2" />
  <path d="M720,500 L720,560 M690,530 L750,530" stroke="#4969b0" stroke-width="1" />
  <path d="M720,505 L725,520 L720,515 L715,520 Z" fill="#7391e0" />
  <text x="720" y="500" fill="white" font-family="Arial" font-size="12" text-anchor="middle">N</text>
  <text x="750" y="530" fill="white" font-family="Arial" font-size="12" text-anchor="middle">E</text>
  <text x="720" y="560" fill="white" font-family="Arial" font-size="12" text-anchor="middle">S</text>
  <text x="690" y="530" fill="white" font-family="Arial" font-size="12" text-anchor="middle">W</text>
  
  <!-- Title -->
  <text x="400" y="40" fill="white" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">THE CAVERNS OF ECHO</text>
  <text x="400" y="65" fill="#a4bdff" font-family="Arial" font-size="14" text-anchor="middle">Home of the Stone of Clarity</text>
</svg>