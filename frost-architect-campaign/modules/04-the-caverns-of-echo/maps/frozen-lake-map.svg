<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="800" fill="#0c1438" />
  
  <!-- Cavern Outline -->
  <path d="M100,100 C150,50 250,80 350,50 C450,20 550,50 650,80 C750,110 800,200 750,300 C700,400 750,500 700,600 C650,700 550,750 450,700 C350,650 250,700 150,650 C50,600 50,500 100,400 C150,300 50,200 100,100 Z" fill="#1a2950" stroke="#293c74" stroke-width="6" />
  
  <!-- Lake Outline -->
  <ellipse cx="400" cy="400" rx="250" ry="200" fill="#293c74" stroke="#4969b0" stroke-width="4" />
  
  <!-- Ice Surface with Transparency -->
  <ellipse cx="400" cy="400" rx="240" ry="190" fill="#7391e0" opacity="0.3" />
  
  <!-- Entrance from Whispering Galleries -->
  <path d="M150,300 C170,280 190,290 210,280 C230,270 250,290 270,280 L270,320 C250,330 230,310 210,320 C190,330 170,320 150,340 Z" fill="#293c74" stroke="#4969b0" stroke-width="2" />
  <text x="210" y="260" fill="white" font-family="Arial" font-size="14" text-anchor="middle">From Whispering</text>
  <text x="210" y="280" fill="white" font-family="Arial" font-size="14" text-anchor="middle">Galleries</text>
  
  <!-- Ice Columns (the puzzle elements) -->
  <!-- Column 1 -->
  <circle cx="300" cy="300" r="15" fill="#a4bdff" opacity="0.8" stroke="#ffffff" stroke-width="1" />
  <text x="300" y="305" fill="#000000" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">1</text>
  
  <!-- Column 2 -->
  <circle cx="350" cy="250" r="15" fill="#a4bdff" opacity="0.8" stroke="#ffffff" stroke-width="1" />
  <text x="350" y="255" fill="#000000" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">2</text>
  
  <!-- Column 3 -->
  <circle cx="450" cy="250" r="15" fill="#a4bdff" opacity="0.8" stroke="#ffffff" stroke-width="1" />
  <text x="450" y="255" fill="#000000" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">3</text>
  
  <!-- Column 4 -->
  <circle cx="500" cy="300" r="15" fill="#a4bdff" opacity="0.8" stroke="#ffffff" stroke-width="1" />
  <text x="500" y="305" fill="#000000" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">4</text>
  
  <!-- Column 5 -->
  <circle cx="500" cy="400" r="15" fill="#a4bdff" opacity="0.8" stroke="#ffffff" stroke-width="1" />
  <text x="500" y="405" fill="#000000" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">5</text>
  
  <!-- Column 6 -->
  <circle cx="450" cy="450" r="15" fill="#a4bdff" opacity="0.8" stroke="#ffffff" stroke-width="1" />
  <text x="450" y="455" fill="#000000" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">6</text>
  
  <!-- Column 7 -->
  <circle cx="350" cy="450" r="15" fill="#a4bdff" opacity="0.8" stroke="#ffffff" stroke-width="1" />
  <text x="350" y="455" fill="#000000" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">7</text>
  
  <!-- Column 8 -->
  <circle cx="300" cy="400" r="15" fill="#a4bdff" opacity="0.8" stroke="#ffffff" stroke-width="1" />
  <text x="300" y="405" fill="#000000" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">8</text>
  
  <!-- Sealed Door to Chamber of Resonance -->
  <path d="M600,350 C620,330 650,340 680,330 L680,370 C650,380 620,370 600,390 Z" fill="#293c74" stroke="#4969b0" stroke-width="2" />
  <rect x="620" y="340" width="40" height="20" fill="#1a2950" stroke="#7391e0" stroke-width="1" />
  <text x="640" y="320" fill="white" font-family="Arial" font-size="14" text-anchor="middle">Sealed Door</text>
  <text x="640" y="380" fill="white" font-family="Arial" font-size="14" text-anchor="middle">To Chamber</text>
  
  <!-- Depth Hunter's Shadow -->
  <path d="M380,350 Q400,380 420,350" stroke="#1a2950" stroke-width="20" opacity="0.7" />
  <path d="M350,400 Q400,430 450,400" stroke="#1a2950" stroke-width="15" opacity="0.5" />
  <path d="M300,300 Q400,270 500,300" stroke="#1a2950" stroke-width="10" opacity="0.4" />
  <circle cx="400" cy="350" r="10" fill="#1a2950" opacity="0.9" />
  <text x="400" y="320" fill="#a4bdff" font-family="Arial" font-size="14" text-anchor="middle">Depth Hunter</text>
  
  <!-- Ice Cracks (appear if puzzle sequence is incorrect) -->
  <path d="M320,320 Q350,350 380,320" stroke="#ffffff" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
  <path d="M420,320 Q450,350 480,320" stroke="#ffffff" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
  <path d="M370,370 Q400,400 430,370" stroke="#ffffff" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
  
  <!-- Vision Spots (where touching the ice reveals visions) -->
  <circle cx="250" cy="350" r="20" fill="#7391e0" opacity="0.2" stroke="#a4bdff" stroke-width="1" stroke-dasharray="5,5" />
  <text x="250" y="350" fill="#a4bdff" font-family="Arial" font-size="8" text-anchor="middle">Vision</text>
  
  <circle cx="400" cy="250" r="20" fill="#7391e0" opacity="0.2" stroke="#a4bdff" stroke-width="1" stroke-dasharray="5,5" />
  <text x="400" y="250" fill="#a4bdff" font-family="Arial" font-size="8" text-anchor="middle">Vision</text>
  
  <circle cx="550" cy="350" r="20" fill="#7391e0" opacity="0.2" stroke="#a4bdff" stroke-width="1" stroke-dasharray="5,5" />
  <text x="550" y="350" fill="#a4bdff" font-family="Arial" font-size="8" text-anchor="middle">Vision</text>
  
  <circle cx="400" cy="450" r="20" fill="#7391e0" opacity="0.2" stroke="#a4bdff" stroke-width="1" stroke-dasharray="5,5" />
  <text x="400" y="450" fill="#a4bdff" font-family="Arial" font-size="8" text-anchor="middle">Vision</text>
  
  <!-- Visions Text (what players see when touching certain spots) -->
  <text x="250" y="380" fill="#a4bdff" font-family="Arial" font-size="8" text-anchor="middle" opacity="0.7">Alliance</text>
  <text x="400" y="280" fill="#a4bdff" font-family="Arial" font-size="8" text-anchor="middle" opacity="0.7">Binding</text>
  <text x="550" y="380" fill="#a4bdff" font-family="Arial" font-size="8" text-anchor="middle" opacity="0.7">Seven</text>
  <text x="400" y="480" fill="#a4bdff" font-family="Arial" font-size="8" text-anchor="middle" opacity="0.7">Clarity</text>
  
  <!-- Stalactites and Stalagmites -->
  <path d="M150,120 L160,150 L170,120" stroke="#a4bdff" stroke-width="2" />
  <path d="M200,100 L210,130 L220,100" stroke="#a4bdff" stroke-width="2" />
  <path d="M600,120 L610,150 L620,120" stroke="#a4bdff" stroke-width="2" />
  <path d="M650,100 L660,130 L670,100" stroke="#a4bdff" stroke-width="2" />
  
  <path d="M150,650 L160,620 L170,650" stroke="#a4bdff" stroke-width="2" />
  <path d="M200,680 L210,650 L220,680" stroke="#a4bdff" stroke-width="2" />
  <path d="M600,650 L610,620 L620,650" stroke="#a4bdff" stroke-width="2" />
  <path d="M650,680 L660,650 L670,680" stroke="#a4bdff" stroke-width="2" />
  
  <!-- Title -->
  <text x="400" y="40" fill="white" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">THE FROZEN LAKE</text>
  <text x="400" y="70" fill="#a4bdff" font-family="Arial" font-size="14" text-anchor="middle">Where Visions of the Past Lie Beneath</text>
  
  <!-- The Correct Column Activation Sequence (hidden in design) -->
  <text x="400" y="700" fill="#a4bdff" font-family="Arial" font-size="14" text-anchor="middle" opacity="0.5">Activation Sequence: 1-8-7-6-5-4-3-2</text>
  
  <!-- Legend -->
  <rect x="600" y="600" width="180" height="150" fill="#1a2950" stroke="#293c74" stroke-width="2" rx="5" ry="5" />
  <text x="690" y="620" fill="white" font-family="Arial" font-size="14" text-anchor="middle">LEGEND</text>
  
  <circle cx="615" cy="640" r="15" fill="#a4bdff" opacity="0.8" stroke="#ffffff" stroke-width="1" />
  <text x="700" y="645" fill="white" font-family="Arial" font-size="12">Ice Column</text>
  
  <path d="M600,665 Q615,675 630,665" stroke="#1a2950" stroke-width="8" opacity="0.7" />
  <text x="700" y="670" fill="white" font-family="Arial" font-size="12">Depth Hunter</text>
  
  <circle cx="615" cy="690" r="20" fill="#7391e0" opacity="0.2" stroke="#a4bdff" stroke-width="1" stroke-dasharray="5,5" />
  <text x="700" y="695" fill="white" font-family="Arial" font-size="12">Vision Spot</text>
  
  <path d="M600,715 Q615,725 630,715" stroke="#ffffff" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
  <text x="700" y="720" fill="white" font-family="Arial" font-size="12">Ice Crack</text>
  
  <rect x="605" y="735" width="20" height="10" fill="#1a2950" stroke="#7391e0" stroke-width="1" />
  <text x="700" y="745" fill="white" font-family="Arial" font-size="12">Sealed Door</text>
</svg>