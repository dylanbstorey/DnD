<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="800" fill="#0c1438" />
  
  <!-- Maze Outline -->
  <path d="M100,100 C150,80 200,60 250,80 C300,100 350,80 400,60 C450,40 500,60 550,80 C600,100 650,80 700,100 L700,700 C650,680 600,700 550,680 C500,660 450,680 400,700 C350,720 300,700 250,680 C200,660 150,680 100,700 Z" fill="#1a2950" stroke="#293c74" stroke-width="4" />
  
  <!-- Entrance from Main Cavern -->
  <path d="M100,400 C120,380 140,390 160,380 C180,370 200,390 220,380 L220,420 C200,430 180,410 160,420 C140,430 120,420 100,440 Z" fill="#293c74" stroke="#4969b0" stroke-width="2" />
  <text x="160" y="360" fill="white" font-family="Arial" font-size="14" text-anchor="middle">From Entrance</text>
  
  <!-- Main Paths -->
  <!-- These are the major corridors through the maze -->
  <!-- Horizontal Passages -->
  <path d="M220,400 L350,400" stroke="#4969b0" stroke-width="4" />
  <path d="M450,400 L590,400" stroke="#4969b0" stroke-width="4" />
  <path d="M300,200 L500,200" stroke="#4969b0" stroke-width="4" />
  <path d="M250,600 L550,600" stroke="#4969b0" stroke-width="4" />
  
  <!-- Vertical Passages -->
  <path d="M350,200 L350,500" stroke="#4969b0" stroke-width="4" />
  <path d="M450,200 L450,500" stroke="#4969b0" stroke-width="4" />
  <path d="M600,300 L600,600" stroke="#4969b0" stroke-width="4" />
  <path d="M250,300 L250,600" stroke="#4969b0" stroke-width="4" />
  
  <!-- Diagonal Passages -->
  <path d="M350,500 L250,600" stroke="#4969b0" stroke-width="4" />
  <path d="M450,500 L550,600" stroke="#4969b0" stroke-width="4" />
  <path d="M500,200 L600,300" stroke="#4969b0" stroke-width="4" />
  <path d="M300,200 L250,300" stroke="#4969b0" stroke-width="4" />
  
  <!-- Central Chamber with Fountain -->
  <circle cx="400" cy="400" r="50" fill="#293c74" stroke="#4969b0" stroke-width="2" />
  <circle cx="400" cy="400" r="40" fill="#1a2950" stroke="#7391e0" stroke-width="1" />
  <circle cx="400" cy="400" r="35" fill="#293c74" />
  <text x="400" y="380" fill="white" font-family="Arial" font-size="14" text-anchor="middle">Frozen</text>
  <text x="400" y="400" fill="white" font-family="Arial" font-size="14" text-anchor="middle">Musical</text>
  <text x="400" y="420" fill="white" font-family="Arial" font-size="14" text-anchor="middle">Fountain</text>
  
  <!-- Fountain Elements -->
  <circle cx="400" cy="400" r="10" fill="#7391e0" opacity="0.7" />
  <circle cx="400" cy="400" r="20" fill="none" stroke="#7391e0" stroke-width="1" stroke-dasharray="2,2" />
  <circle cx="400" cy="400" r="30" fill="none" stroke="#7391e0" stroke-width="1" stroke-dasharray="2,2" />
  
  <!-- Musical Note Patterns around Fountain -->
  <circle cx="380" cy="380" r="3" fill="#a4bdff" />
  <circle cx="390" cy="370" r="3" fill="#a4bdff" />
  <circle cx="410" cy="370" r="3" fill="#a4bdff" />
  <circle cx="420" cy="380" r="3" fill="#a4bdff" />
  <circle cx="420" cy="420" r="3" fill="#a4bdff" />
  <circle cx="410" cy="430" r="3" fill="#a4bdff" />
  <circle cx="390" cy="430" r="3" fill="#a4bdff" />
  <circle cx="380" cy="420" r="3" fill="#a4bdff" />
  
  <!-- Ice Mirror Locations -->
  <!-- These are special locations where sound reflects in unusual ways -->
  <!-- Mirror 1 -->
  <circle cx="300" cy="200" r="15" fill="#7391e0" opacity="0.3" />
  <text x="300" y="180" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Mirror</text>
  
  <!-- Mirror 2 -->
  <circle cx="500" cy="200" r="15" fill="#7391e0" opacity="0.3" />
  <text x="500" y="180" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Mirror</text>
  
  <!-- Mirror 3 -->
  <circle cx="600" cy="300" r="15" fill="#7391e0" opacity="0.3" />
  <text x="600" y="280" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Mirror</text>
  
  <!-- Mirror 4 -->
  <circle cx="250" cy="300" r="15" fill="#7391e0" opacity="0.3" />
  <text x="250" y="280" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Mirror</text>
  
  <!-- Mirror 5 -->
  <circle cx="350" cy="500" r="15" fill="#7391e0" opacity="0.3" />
  <text x="350" y="520" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Mirror</text>
  
  <!-- Mirror 6 -->
  <circle cx="450" cy="500" r="15" fill="#7391e0" opacity="0.3" />
  <text x="450" y="520" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Mirror</text>
  
  <!-- Mirror 7 -->
  <circle cx="250" cy="600" r="15" fill="#7391e0" opacity="0.3" />
  <text x="250" y="620" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Mirror</text>
  
  <!-- Mirror 8 -->
  <circle cx="550" cy="600" r="15" fill="#7391e0" opacity="0.3" />
  <text x="550" y="620" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Mirror</text>
  
  <!-- Echo Mimic Locations -->
  <circle cx="350" cy="300" r="8" fill="#a4bdff" opacity="0.6" />
  <text x="350" y="330" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Echo Mimic</text>
  
  <circle cx="500" cy="500" r="8" fill="#a4bdff" opacity="0.6" />
  <text x="500" y="530" fill="white" font-family="Arial" font-size="10" text-anchor="middle">Echo Mimic</text>
  
  <!-- Hidden Passages (dotted lines) -->
  <path d="M350,300 Q380,330 400,350" stroke="#7391e0" stroke-width="2" stroke-dasharray="5,5" />
  <path d="M500,500 Q480,450 450,400" stroke="#7391e0" stroke-width="2" stroke-dasharray="5,5" />
  <path d="M550,600 Q580,550 600,500" stroke="#7391e0" stroke-width="2" stroke-dasharray="5,5" />
  
  <!-- Secret Door to Frozen Lake -->
  <path d="M600,500 Q620,510 640,500 Q660,490 680,500" stroke="#7391e0" stroke-width="3" stroke-dasharray="5,5" />
  <text x="650" y="480" fill="white" font-family="Arial" font-size="14" text-anchor="middle">To Frozen Lake</text>
  <text x="650" y="500" fill="#a4bdff" font-family="Arial" font-size="10" text-anchor="middle">(Secret Door)</text>
  
  <!-- Sound Patterns (ripple effects that move through the galleries) -->
  <path d="M250,400 Q300,380 350,400 Q400,420 450,400 Q500,380 550,400" stroke="#a4bdff" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <path d="M400,300 Q430,350 400,400 Q370,450 400,500" stroke="#a4bdff" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <path d="M300,300 Q350,270 400,300 Q450,330 500,300" stroke="#a4bdff" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  
  <!-- Dead Ends -->
  <path d="M350,200 Q330,150 300,120" stroke="#4969b0" stroke-width="3" />
  <path d="M450,200 Q470,150 500,120" stroke="#4969b0" stroke-width="3" />
  <path d="M600,400 Q650,400 680,380" stroke="#4969b0" stroke-width="3" />
  <path d="M350,400 Q330,450 300,480" stroke="#4969b0" stroke-width="3" />
  
  <!-- Crystalline Formations -->
  <path d="M320,120 L310,100 L300,120" stroke="#a4bdff" stroke-width="2" />
  <path d="M480,120 L500,90 L520,120" stroke="#a4bdff" stroke-width="2" />
  <path d="M680,360 L700,380 L680,400" stroke="#a4bdff" stroke-width="2" />
  <path d="M280,480 L300,510 L320,480" stroke="#a4bdff" stroke-width="2" />
  
  <!-- Title -->
  <text x="400" y="40" fill="white" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">THE WHISPERING GALLERIES</text>
  <text x="400" y="65" fill="#a4bdff" font-family="Arial" font-size="14" text-anchor="middle">Where Echoes Never Die</text>
  
  <!-- The Tone Sequence (the solution to the puzzle) hidden in the design -->
  <text x="380" y="380" fill="#ffffff" font-family="Arial" font-size="8" text-anchor="middle" opacity="0.4">1</text>
  <text x="420" y="380" fill="#ffffff" font-family="Arial" font-size="8" text-anchor="middle" opacity="0.4">2</text>
  <text x="420" y="420" fill="#ffffff" font-family="Arial" font-size="8" text-anchor="middle" opacity="0.4">3</text>
  <text x="380" y="420" fill="#ffffff" font-family="Arial" font-size="8" text-anchor="middle" opacity="0.4">4</text>
  <text x="390" y="370" fill="#ffffff" font-family="Arial" font-size="8" text-anchor="middle" opacity="0.4">5</text>
  <text x="410" y="370" fill="#ffffff" font-family="Arial" font-size="8" text-anchor="middle" opacity="0.4">6</text>
  <text x="410" y="430" fill="#ffffff" font-family="Arial" font-size="8" text-anchor="middle" opacity="0.4">7</text>
  <text x="390" y="430" fill="#ffffff" font-family="Arial" font-size="8" text-anchor="middle" opacity="0.4">8</text>
  
  <!-- Legend -->
  <rect x="600" y="650" width="180" height="130" fill="#1a2950" stroke="#293c74" stroke-width="2" rx="5" ry="5" />
  <text x="690" y="670" fill="white" font-family="Arial" font-size="14" text-anchor="middle">LEGEND</text>
  
  <line x1="610" y1="690" x2="640" y2="690" stroke="#4969b0" stroke-width="4" />
  <text x="700" y="695" fill="white" font-family="Arial" font-size="12">Main Passages</text>
  
  <line x1="610" y1="715" x2="640" y2="715" stroke="#7391e0" stroke-width="2" stroke-dasharray="5,5" />
  <text x="700" y="720" fill="white" font-family="Arial" font-size="12">Hidden Passages</text>
  
  <circle cx="625" cy="740" r="8" fill="#a4bdff" opacity="0.6" />
  <text x="700" y="745" fill="white" font-family="Arial" font-size="12">Echo Mimic</text>
  
  <circle cx="625" cy="765" r="15" fill="#7391e0" opacity="0.3" />
  <text x="700" y="770" fill="white" font-family="Arial" font-size="12">Ice Mirror</text>
</svg>