<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#e8f4f8"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" fill="#2a5b84" text-anchor="middle" font-weight="bold">The Frost Sphere: Structure and Components</text>
  
  <!-- Main sphere cross-section -->
  <circle cx="400" cy="300" r="200" fill="#d6e9f5" stroke="#2a5b84" stroke-width="4"/>
  <circle cx="400" cy="300" r="198" fill="none" stroke="#77aadd" stroke-width="1" stroke-dasharray="10,5"/>
  
  <!-- Core -->
  <circle cx="400" cy="300" r="60" fill="#77aadd" stroke="#2a5b84" stroke-width="2">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="300" r="40" fill="#a1d6e2" stroke="none">
    <animate attributeName="r" values="35;45;35" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Conduits -->
  <path d="M400,240 L400,160" fill="none" stroke="#77aadd" stroke-width="12" opacity="0.6"/>
  <path d="M400,360 L400,440" fill="none" stroke="#77aadd" stroke-width="12" opacity="0.6"/>
  <path d="M340,300 L260,300" fill="none" stroke="#77aadd" stroke-width="12" opacity="0.6"/>
  <path d="M460,300 L540,300" fill="none" stroke="#77aadd" stroke-width="12" opacity="0.6"/>
  
  <!-- Secondary conduits -->
  <path d="M350,250 L280,180" fill="none" stroke="#77aadd" stroke-width="6" opacity="0.6"/>
  <path d="M450,250 L520,180" fill="none" stroke="#77aadd" stroke-width="6" opacity="0.6"/>
  <path d="M350,350 L280,420" fill="none" stroke="#77aadd" stroke-width="6" opacity="0.6"/>
  <path d="M450,350 L520,420" fill="none" stroke="#77aadd" stroke-width="6" opacity="0.6"/>
  
  <!-- Runes on sphere surface -->
  <g fill="#2a5b84">
    <path d="M400,105 L410,95 L400,85 L390,95 Z"/>
    <path d="M400,495 L410,505 L400,515 L390,505 Z"/>
    <path d="M200,300 L190,310 L200,320 L210,310 Z"/>
    <path d="M600,300 L610,310 L600,320 L590,310 Z"/>
    
    <path d="M265,165 L275,155 L265,145 L255,155 Z"/>
    <path d="M535,165 L545,155 L535,145 L525,155 Z"/>
    <path d="M265,435 L275,445 L265,455 L255,445 Z"/>
    <path d="M535,435 L545,445 L535,455 L525,445 Z"/>
  </g>
  
  <!-- Control panel -->
  <rect x="520" y="270" width="60" height="60" rx="5" fill="#d6d6d6" stroke="#2a5b84" stroke-width="2"/>
  <rect x="530" y="280" width="40" height="40" rx="3" fill="#445566" stroke="#2a5b84" stroke-width="1"/>
  <circle cx="550" cy="300" r="15" fill="#77aadd" opacity="0.8">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 3D Map display -->
  <ellipse cx="400" cy="440" rx="40" ry="20" fill="#445566" stroke="#2a5b84" stroke-width="1"/>
  <circle cx="400" cy="440" r="2" fill="#ffffff"/>
  <circle cx="385" cy="435" r="1" fill="#ffffff"/>
  <circle cx="415" cy="445" r="1" fill="#ffffff"/>
  <circle cx="395" cy="455" r="1" fill="#ffffff"/>
  <circle cx="420" cy="430" r="1" fill="#ffffff"/>
  
  <!-- Mini-spheres in storage -->
  <circle cx="280" cy="270" r="15" fill="#d6e9f5" stroke="#2a5b84" stroke-width="1"/>
  <circle cx="280" cy="270" r="5" fill="#77aadd" opacity="0.6"/>
  
  <circle cx="280" cy="310" r="15" fill="#d6e9f5" stroke="#2a5b84" stroke-width="1"/>
  <circle cx="280" cy="310" r="5" fill="#77aadd" opacity="0.6"/>
  
  <circle cx="280" cy="350" r="15" fill="#d6e9f5" stroke="#2a5b84" stroke-width="1"/>
  <circle cx="280" cy="350" r="5" fill="#77aadd" opacity="0.6"/>
  
  <!-- Entrance -->
  <path d="M400,500 L380,490 L380,470 L400,460 L420,470 L420,490 Z" fill="#333344" stroke="#2a5b84" stroke-width="2"/>
  
  <!-- Labels -->
  <!-- Core -->
  <line x1="400" y1="300" x2="310" y2="220" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="200" y="180" width="100" height="40" rx="5" fill="#ffffff" fill-opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="250" y="195" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Elemental Ice Core</text>
  <text x="250" y="210" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Source of cold energy</text>
  
  <!-- Control panel -->
  <line x1="550" y1="300" x2="600" y2="250" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="600" y="220" width="120" height="40" rx="5" fill="#ffffff" fill-opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="660" y="240" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Control Panel</text>
  <text x="660" y="255" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Regulates energy flow</text>
  
  <!-- Map display -->
  <line x1="400" y1="440" x2="460" y2="490" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="460" y="490" width="120" height="40" rx="5" fill="#ffffff" fill-opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="520" y="510" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">3D Map Display</text>
  <text x="520" y="525" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Shows sphere network</text>
  
  <!-- Mini-spheres -->
  <line x1="280" y1="310" x2="200" y2="350" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="100" y="330" width="100" height="40" rx="5" fill="#ffffff" fill-opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="150" y="350" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Mini-Spheres</text>
  <text x="150" y="365" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Ready for deployment</text>
  
  <!-- Entrance -->
  <line x1="400" y1="480" x2="320" y2="520" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="220" y="520" width="100" height="30" rx="5" fill="#ffffff" fill-opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="270" y="540" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Hexagonal Entrance</text>
  
  <!-- Runes -->
  <line x1="600" y1="300" x2="650" y2="350" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <rect x="650" y="350" width="100" height="40" rx="5" fill="#ffffff" fill-opacity="0.7" stroke="#333" stroke-width="1"/>
  <text x="700" y="370" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">Frost Runes</text>
  <text x="700" y="385" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Channel cold energy</text>